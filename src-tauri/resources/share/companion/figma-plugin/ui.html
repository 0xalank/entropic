<!doctype html>
<meta charset="utf-8" />
<script>
  const BRIDGE_URL = "ws://127.0.0.1:19796";
  let socket = null;
  let reconnectTimer = null;
  let lastSelection = null;

  function postToBridge(payload) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify(payload));
  }

  function connect() {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
      return;
    }
    socket = new WebSocket(BRIDGE_URL);
    socket.addEventListener("open", () => {
      postToBridge({ type: "hello", source: "figma-plugin-ui", updatedAt: Date.now() });
      if (lastSelection) postToBridge(lastSelection);
      parent.postMessage({ pluginMessage: { type: "request-selection" } }, "*");
    });
    socket.addEventListener("message", (event) => {
      try {
        const message = JSON.parse(event.data);
        parent.postMessage({ pluginMessage: message }, "*");
      } catch (error) {
        postToBridge({
          type: "error",
          source: "figma-plugin-ui",
          message: String(error),
          updatedAt: Date.now()
        });
      }
    });
    socket.addEventListener("close", scheduleReconnect);
    socket.addEventListener("error", scheduleReconnect);
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, 1000);
  }

  window.onmessage = (event) => {
    const message = event.data && event.data.pluginMessage;
    if (!message) return;
    lastSelection = message;
    postToBridge(message);
  };

  connect();
</script>
